# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/schemas/projmgr/2.11.0/tools/projmgr/schemas/csolution.schema.json
solution:
  target-types:
    - type: STM32H7P5I-DK
      device: STM32H7P5IIK6Q
  output-dirs:
    tmpdir: build/tmp
    outdir: $SolutionDir()$/build/$Project$.$BuildType$
  generators:
    base-dir: $ProjectDir()$/generated
    options:
      - generator: stm32h7pxx_hal_mx2codegen
        path: $SolutionDir()$/../generated/hal/
      - generator: syscalls_mx2codegen
        path: $SolutionDir()$/../generated/utilities/syscalls
      - generator: button_mx2codegen
        path: $SolutionDir()$/../generated/parts/button
      - generator: led_mx2codegen
        path: $SolutionDir()$/../generated/parts/led
      - generator: mx25lm51245g_mx2codegen
        path: $SolutionDir()$/../generated/parts/mx25lm51245g
      - generator: potentiometer_mx2codegen
        path: $SolutionDir()$/../generated/parts/potentiometer
      - generator: st7315_mx2codegen
        path: $SolutionDir()$/../generated/parts/st7315
      - generator: tcpp01_mx2codegen
        path: $SolutionDir()$/../generated/parts/tcpp01
      - generator: basic_stdio_mx2codegen
        path: $SolutionDir()$/../generated/utilities/basic_stdio
  build-types:
    - type: release_AC6
      compiler: AC6
  packs:
    - pack: STMicroelectronics::CMSIS
      path: ../../../../../arch/cmsis
    - pack: STMicroelectronics::basic_stdio
      path: ../../../../../utilities/basic_stdio
    - pack: STMicroelectronics::button_part_drivers
      path: ../../../../../part_drivers/button
    - pack: STMicroelectronics::led_part_drivers
      path: ../../../../../part_drivers/led
    - pack: STMicroelectronics::mx25lm51245g_part_drivers
      path: ../../../../../part_drivers/mx25lm51245g
    - pack: STMicroelectronics::potentiometer_part_drivers
      path: ../../../../../part_drivers/potentiometer
    - pack: STMicroelectronics::st7315_part_drivers
      path: ../../../../../part_drivers/st7315
    - pack: STMicroelectronics::stm32h7pxx_dfp
      path: ../../../../../stm32h7pxx_dfp
    - pack: STMicroelectronics::stm32h7pxx_hal_drivers
      path: ../../../../../stm32h7pxx_drivers
    - pack: STMicroelectronics::syscalls
      path: ../../../../../utilities/syscalls
    - pack: STMicroelectronics::tcpp01_part_drivers
      path: ../../../../../part_drivers/tcpp01
  projects:
    - project: project/template_start_from_stm32h7p5i-dk.cproject.yml
