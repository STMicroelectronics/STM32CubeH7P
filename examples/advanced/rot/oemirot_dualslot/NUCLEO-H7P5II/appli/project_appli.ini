[provisioning]
ini_path=./../provisioning/provisioning.ini

[build]
binary_path = ./../bin/appli.hex

[image_provisioning]
xml = ./xml/appli_code_provisioning_image.xml
path = ./../bin/appli_provisioning_sign.hex

[image_fwu]
xml = ./xml/appli_code_fwu_image.xml
path = ./../bin/appli_fwu_enc_sign.bin

[header]
appli_flash_layout_path = ./appli_flash_layout.h

[AC6]
linker = ./user_modifiable/Device/STM32H7P5IIK6/stm32h7p5xi_flash.sct

[IAR]
linker = ./user_modifiable/Device/STM32H7P5IIK6/stm32h7p5xi_flash.icf

[GCC]
linker = ./user_modifiable/Device/STM32H7P5IIK6/stm32h7p5xi_flash.ld
